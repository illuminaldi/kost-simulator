# Deploy server verifikasi pembelian Diamond ke Cloudflare Workers (gratis) — bisa dari HP:
# GitHub > Actions > "Deploy server verifikasi" > Run workflow.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token API Cloudflare (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID  Account ID Cloudflare
#   GOOGLE_SA_JSON         isi file JSON key service account Google (akses Play Developer API)
name: Deploy server verifikasi

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: godot/server/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cek secrets
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN belum diisi"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID belum diisi"; exit 1; }
          [ -n "$SA" ] || { echo "::error::Secret GOOGLE_SA_JSON belum diisi"; exit 1; }
          echo "$SA" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('client_email') and d.get('private_key'); print('Service account:', d['client_email'])" \
            || { echo "::error::GOOGLE_SA_JSON bukan file JSON key service account yang valid"; exit 1; }

      - name: KV namespace (dibuat sekali)
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces
          ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((n['id'] for n in d['result'] if n['title']=='cozy-kost-purchases'),''))")
          if [ -z "$ID" ]; then
            ID=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d '{"title":"cozy-kost-purchases"}' "$API" | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['id'])")
          fi
          sed -i "s/KV_ID_PLACEHOLDER/$ID/" wrangler.toml
          echo "KV id: $ID"

      - name: Deploy worker
        run: npx --yes wrangler@3 deploy

      - name: Simpan kunci service account
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: printf '%s' "$SA" | npx --yes wrangler@3 secret put GOOGLE_SA_JSON

      - name: Alamat server
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['subdomain'])")
          URL="https://cozy-kost-verify.$SUB.workers.dev"
          echo "### Server verifikasi aktif: $URL" >> $GITHUB_STEP_SUMMARY
          echo "VERIFY_URL = $URL"
          curl -fsS "$URL/" || true
